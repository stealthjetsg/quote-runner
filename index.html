<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stealth Jet Quote Runner</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap">
<style>
  :root {
    --bg: #e9edf3;
    --paper: #ffffff;
    --paper-2: #f5f7fa;
    --ink: #1c2430;
    --ink-soft: #4b5668;
    --muted: #798295;
    --border: #d7dce4;
    --border-soft: #e6e9ef;
    --navy: #1f3864;
    --navy-ink: #16294b;
    --navy-soft: #2c4a7c;
    --red: #b0392c;
    --red-soft: #fbeae7;
    --green: #2f7a4f;
    --green-soft: #e8f4ec;
    --focus: #3d6fb4;
    --shadow: 0 1px 2px rgba(28,36,48,.06), 0 12px 32px -16px rgba(28,36,48,.28);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12161d;
      --paper: #1b212b;
      --paper-2: #212836;
      --ink: #e7eaf0;
      --ink-soft: #b7bfcd;
      --muted: #838ea1;
      --border: #333d4d;
      --border-soft: #2a323f;
      --navy: #6f93cc;
      --navy-ink: #a9c2e6;
      --navy-soft: #557bb3;
      --red: #e0685a;
      --red-soft: #3a2320;
      --green: #6bbf8e;
      --green-soft: #1d2c22;
      --focus: #6f93cc;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 20px 44px -18px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"] {
    --bg: #12161d;
    --paper: #1b212b;
    --paper-2: #212836;
    --ink: #e7eaf0;
    --ink-soft: #b7bfcd;
    --muted: #838ea1;
    --border: #333d4d;
    --border-soft: #2a323f;
    --navy: #6f93cc;
    --navy-ink: #a9c2e6;
    --navy-soft: #557bb3;
    --red: #e0685a;
    --red-soft: #3a2320;
    --green: #6bbf8e;
    --green-soft: #1d2c22;
    --focus: #6f93cc;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 20px 44px -18px rgba(0,0,0,.6);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    line-height: 1.45;
  }
  #root { min-height: 100vh; }

  .app-shell {
    max-width: 980px;
    margin: 0 auto;
    padding: 28px 20px 80px;
  }

  .toolbar {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }
  .toolbar-right { display: flex; align-items: center; gap: 14px; }
  .signin-box { display: flex; align-items: center; gap: 8px; }
  .signin-status { font-size: 12px; color: var(--ink-soft); }
  .ghost.small { padding: 6px 12px; font-size: 12.5px; }
  @media print { .toolbar-right { display: none !important; } }
  .pdf-render-mode .toolbar-right { display: none !important; }
  .toolbar h1 {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600;
    font-size: 21px;
    letter-spacing: 0.01em;
    margin: 0;
    color: var(--ink);
  }
  .toolbar .sub {
    font-size: 12.5px;
    color: var(--muted);
    margin-top: 2px;
  }
  .save-status {
    font-size: 12.5px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .save-status.ok { color: var(--green); }
  .save-status.err { color: var(--red); }

  .paper {
    background: var(--paper);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  /* ---- Header band ---- */
  .doc-header {
    display: grid;
    grid-template-columns: 84px 1fr 220px;
    gap: 18px;
    align-items: start;
    padding: 22px 24px 18px;
    border-bottom: 1px solid var(--border);
  }
  .doc-header img { width: 84px; height: auto; display: block; margin-top: 2px; }
  .company-name {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600;
    font-size: 20px;
    color: var(--ink);
    margin: 0 0 4px;
  }
  .company-addr { font-size: 12.5px; color: var(--ink-soft); line-height: 1.6; }
  .quote-box {
    background: var(--navy);
    border-radius: 8px;
    color: #fff;
    padding: 12px 14px;
    font-size: 12.5px;
  }
  :root[data-theme="dark"] .quote-box,
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .quote-box { color: #0c1420; } }
  .quote-box .qb-title {
    font-size: 11px;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    opacity: 0.85;
    margin-bottom: 8px;
    font-weight: 600;
  }
  .quote-box .qb-num {
    font-family: "IBM Plex Mono", monospace;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.02em;
    margin-bottom: 10px;
  }
  .quote-box dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 8px; margin: 0; }
  .quote-box dt { opacity: 0.75; font-weight: 500; }
  .quote-box dd { margin: 0; font-variant-numeric: tabular-nums; text-align: right; }

  /* ---- Body sections ---- */
  .section { padding: 18px 24px; border-bottom: 1px solid var(--border-soft); }
  .section:last-child { border-bottom: none; }
  .section-label {
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 600;
    margin: 0 0 10px;
  }

  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 640px) { .two-col { grid-template-columns: 1fr; } .doc-header { grid-template-columns: 60px 1fr; } .quote-box { grid-column: 1 / -1; } }

  label.field { display: block; font-size: 11.5px; color: var(--muted); margin-bottom: 4px; font-weight: 500; }
  input[type="text"], input[type="number"], input[type="email"], textarea, select {
    width: 100%;
    font: inherit;
    font-size: 13.5px;
    color: var(--ink);
    background: var(--paper-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 9px;
  }
  textarea { resize: vertical; min-height: 64px; font-family: inherit; }
  /* Always-present plain-text twin of #f-to / #f-shipto / #f-notes / .f-note,
     kept in sync on every input (see syncTaMirror). Invisible on screen —
     @media print and .pdf-render-mode below swap the visibility the other
     way, so print/PDF never has to mutate this content at capture time. */
  .ta-mirror { display: none; }
  input:focus, textarea:focus, select:focus, button:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 1px;
  }
  .field-row { margin-bottom: 10px; }
  .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
  .field-grid.cols-3 { grid-template-columns: 1fr 1fr 1fr; }

  /* ---- Item table ---- */
  .item-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .item-table th {
    text-align: left;
    font-size: 10.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #fff;
    background: var(--navy);
    padding: 8px 8px;
    font-weight: 600;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .item-table th { color: #0c1420; } }
  :root[data-theme="dark"] .item-table th { color: #0c1420; }
  .item-table th.num, .item-table td.num { text-align: right; }
  .item-table td { padding: 6px 6px; border-bottom: 1px solid var(--border-soft); vertical-align: middle; }
  .item-table input, .item-table select { padding: 6px 7px; font-size: 13px; }
  /* A floor under the CD column's width hint above — on a narrow item
     table (fewer/short columns visible, e.g. cost & markup hidden) auto
     table layout could otherwise still squeeze this below a usable size. */
  .item-table .f-cd { min-width: 56px; }
  /* Same floor, same reasoning, for Cert — the print/PDF path hides this
     select entirely in favor of the wrapping .cert-mirror (see the CSS and
     comment near .col-cert in @media print), so it has no print-time floor
     of its own, but on screen it's still a real control the auto table
     layout can squeeze arbitrarily narrow (measured at ~36px without this —
     technically still clickable/keyboard-operable underneath, same as the
     original CD bug, which is exactly why that one looked "not working"
     rather than obviously broken). Sized to comfortably show any of the
     four option labels without being pathologically tight. */
  .item-table .f-cert { min-width: 96px; }
  /* Same floor, same reasoning, for UOM ("FEET" plus the dropdown arrow is
     wider than any CD code) and Qty — a percentage-only width let both
     get squeezed narrow enough in print that their own value silently
     rendered as nothing: not clipped-with-ellipsis, not overflowing, just
     invisible, with no visual sign anything was wrong (measured: the DOM
     value was intact, `visibility: visible`, `opacity: 1` — the box was
     simply too narrow for Chrome to draw the text inside it at all).
     Qty's floor is sized for a full 6-digit quantity (e.g. "100000", a
     real value seen in this tool's own RFQ import test fixtures), measured
     directly (scrollWidth vs clientWidth under print emulation) rather than
     estimated — an earlier, smaller floor "looked" generous on paper but
     still let a 6-digit quantity clip in the actual render. */
  .item-table .f-uom { min-width: 68px; }
  .item-table .f-qty { min-width: 84px; }
  /* Same floor for Part Number — a real trading part number ("18276A300",
     "HTE7300CR1-018") is often longer than any other single-line control
     in the row, and it can't wrap like Description/Lead Time do (there's
     no mirror for it, and a part number broken across two lines invites
     misreading it as two different numbers). Sized (via the same direct
     scrollWidth measurement) for a full 14+ character part number. */
  .item-table .f-part { min-width: 136px; }
  /* Same floor for Unit Price — previously had none at all, so a small
     decimal value like "0.05" (a real RFQ unit cost) was squeezed into
     the same invisible-blank failure as the other native controls above.
     The 84px this started at accounted for the digits themselves but not
     for the browser's own up/down spinner arrows on a number input, which
     eat a further ~20px on the right — so a real 4-digit-dollar price
     (e.g. "1234.56", an ordinary quote for a real aerospace part, not an
     edge case) had its leading digit scrolled out of view behind the
     spinner the moment it was typed: the exact same invisible-blank
     failure as before, just re-introduced by a control the earlier floor
     didn't know to leave room for. Fixed two ways: drop the spinner
     entirely (it adds nothing for a currency field, and a misclick on the
     down-arrow silently changing a quoted price is its own hazard) and
     widen the floor with the space that recovers, plus real headroom
     above the 7-character test case that first exposed this. */
  .item-table .f-price {
    min-width: 108px;
    -moz-appearance: textfield;
  }
  .item-table .f-price::-webkit-outer-spin-button,
  .item-table .f-price::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  .col-part .f-note {
    margin-top: 4px; font-size: 11px; font-style: italic; color: var(--muted);
    padding: 3px 6px; background: transparent; border: 1px dashed var(--border);
    min-height: 0; resize: vertical; font-family: inherit;
  }
  .col-part .f-note:focus { font-style: normal; }
  .row-note-toggle {
    margin-top: 3px; background: transparent; border: none;
    color: var(--navy-soft); font: inherit; font-size: 11px; font-weight: 600;
    padding: 0; cursor: pointer;
  }
  /* Base rule deliberately omits `display` — the browser's own [hidden]
     default (display:none) covers the case where an item was added with a
     note already on it (no toggle rendered at all — see itemRowHtml);
     :not([hidden]) turns it into a block element only for the normal
     on-screen "+ Note" toggle of an otherwise-empty line. Print and PDF
     hide it unconditionally by class instead (see @media print and
     .pdf-render-mode), regardless of this attribute. */
  .row-note-toggle:not([hidden]) { display: block; }
  .row-note-toggle:hover { text-decoration: underline; }
  .item-table .line-amt {
    font-variant-numeric: tabular-nums;
    font-family: "IBM Plex Mono", monospace;
    font-size: 13px;
    text-align: right;
    white-space: nowrap;
    padding-right: 4px;
    /* Line Amt is plain text, not a form control, so it was never covered
       by the min-width floors added for Part/Qty/UOM/Price above — but a
       large total (a high quantity times a real unit price, e.g.
       "12,579.84") is exactly as wide as those, and being the last column
       it overflowed straight off the right edge of the printed page
       instead of just into a neighboring cell, silently losing the last
       digit or two. display:inline-block is what makes min-width take
       effect at all here — plain inline text ignores it. Sized (by the
       same real-measurement approach as the other floors) for line totals
       comfortably up to $999,999.99. */
    display: inline-block;
    min-width: 84px;
  }
  .col-part { width: 13%; }
  .col-description { width: 14%; }
  /* CD holds a 3-letter code plus the browser's own dropdown arrow — 5%
     measured out to ~32px in practice, too narrow for either to render
     without crowding, which made the control look unresponsive when
     clicked (nothing visibly changed because there was barely room to
     show what did). */
  .col-cd { width: 9%; }
  .col-cert { width: 14%; }
  .col-qty { width: 7%; }
  /* Same crowding risk as CD above — "FEET" plus the dropdown arrow needs
     real room too. */
  .col-uom { width: 8%; }
  .col-cost { width: 8%; }
  .col-markup { width: 7%; }
  .col-price { width: 9%; }
  .col-leadtime { width: 10%; }
  .col-amt { width: 9%; }
  .col-del { width: 24px; }
  .col-cost input, .col-markup input { color: var(--muted); }
  .col-price input { font-weight: 600; }
  .price-cell { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
  .no-quote-pill {
    font-size: 12px; font-style: italic; color: var(--muted);
    background: var(--paper-2); border: 1px dashed var(--border);
    border-radius: 5px; padding: 3px 7px; white-space: nowrap;
  }
  .price-noquote-toggle {
    background: transparent; border: none; color: var(--muted); cursor: pointer;
    font: inherit; font-size: 10.5px; padding: 1px 0; white-space: nowrap;
  }
  .price-noquote-toggle:hover { color: var(--navy-soft); text-decoration: underline; }
  .line-amt.no-quote { font-style: italic; color: var(--muted); font-size: 12px; }
  #f-terms-custom { margin-top: 6px; }
  .line-margin {
    font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums;
    font-family: "IBM Plex Mono", monospace; margin-top: 1px;
  }
  .line-margin.neg { color: var(--red); }
  .row-del {
    background: transparent; border: none; color: var(--muted); cursor: pointer;
    font-size: 15px; line-height: 1; padding: 4px; border-radius: 4px;
  }
  .row-del:hover { color: var(--red); background: var(--red-soft); }
  .add-line {
    margin-top: 10px;
    background: transparent;
    border: 1px dashed var(--border);
    color: var(--navy-soft);
    font-size: 12.5px;
    font-weight: 600;
    padding: 7px 12px;
    border-radius: 6px;
    cursor: pointer;
  }
  .add-line:hover { border-color: var(--navy-soft); background: var(--paper-2); }

  .totals-wrap { display: grid; grid-template-columns: 1fr 260px; gap: 20px; align-items: start; }
  .notes-box {
    font-size: 12px; color: var(--ink-soft); background: var(--paper-2);
    border: 1px solid var(--border-soft); border-radius: 6px; padding: 10px 12px;
    line-height: 1.6; min-height: 0; font-family: inherit;
  }
  .margin-box {
    margin-top: 10px; font-size: 12px; color: var(--ink-soft);
    background: var(--paper-2); border: 1px dashed var(--border); border-radius: 6px; padding: 10px 12px;
  }
  .margin-box-title { font-size: 10.5px; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  .margin-row { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; font-family: "IBM Plex Mono", monospace; padding: 1px 0; }
  .margin-row.pct { color: var(--muted); font-size: 11px; }
  .totals-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .totals-table td { padding: 5px 2px; }
  .totals-table td.tl { color: var(--ink-soft); }
  .totals-table td.tv { text-align: right; font-variant-numeric: tabular-nums; font-family: "IBM Plex Mono", monospace; }
  .totals-table input { text-align: right; padding: 5px 7px; font-size: 13px; }
  .totals-table tr.grand td { border-top: 1px solid var(--border); padding-top: 9px; font-weight: 700; font-size: 15.5px; color: var(--ink); }
  .totals-table tr.grand td.tv { color: var(--red); }

  .actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  button.primary {
    background: var(--navy); color: #fff; border: none; border-radius: 7px;
    font: inherit; font-weight: 600; font-size: 13.5px; padding: 10px 18px; cursor: pointer;
  }
  button.primary:hover { background: var(--navy-ink); }
  button.primary:disabled { opacity: 0.55; cursor: default; }
  button.ghost {
    background: transparent; color: var(--ink-soft); border: 1px solid var(--border);
    border-radius: 7px; font: inherit; font-weight: 600; font-size: 13.5px; padding: 10px 16px; cursor: pointer;
  }
  button.ghost:hover { border-color: var(--muted); color: var(--ink); }
  button.ghost:disabled { opacity: 0.55; cursor: default; }
  button.danger {
    background: var(--red); color: #fff; border: none; border-radius: 7px;
    font: inherit; font-weight: 600; font-size: 13.5px; padding: 10px 18px; cursor: pointer;
  }
  button.danger:hover { filter: brightness(0.92); }

  /* In-page stand-in for window.confirm(), which the sandboxed iframe this
     page runs in silently ignores (same restriction that blocks print()).
     Base rule deliberately omits `display` so the browser's own [hidden]
     default (display:none) still wins when the overlay is hidden — only the
     :not([hidden]) rule below turns it into a centered flex box. */
  .confirm-overlay {
    position: fixed; inset: 0; background: rgba(15, 20, 28, 0.55);
    padding: 20px; z-index: 1000;
  }
  .confirm-overlay:not([hidden]) { display: flex; align-items: center; justify-content: center; }
  .confirm-box {
    background: var(--paper); border: 1px solid var(--border); border-radius: 10px;
    box-shadow: var(--shadow); max-width: 360px; width: 100%; padding: 20px 22px;
  }
  .confirm-box p { margin: 0 0 18px; font-size: 13.5px; color: var(--ink); line-height: 1.55; }
  .confirm-actions { display: flex; justify-content: flex-end; gap: 10px; }

  /* ---- Recent quotes ledger ---- */
  .ledger { margin-top: 26px; }
  .ledger h2 {
    font-family: "Fraunces", Georgia, serif;
    font-size: 15px; font-weight: 600; margin: 0 0 10px; color: var(--ink);
  }
  table.ledger-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.ledger-table th {
    text-align: left; color: var(--muted); font-weight: 600; font-size: 10.5px;
    letter-spacing: 0.05em; text-transform: uppercase; padding: 6px 10px; border-bottom: 1px solid var(--border);
  }
  table.ledger-table td { padding: 8px 10px; border-bottom: 1px solid var(--border-soft); }
  table.ledger-table td.num { text-align: right; font-variant-numeric: tabular-nums; font-family: "IBM Plex Mono", monospace; }
  table.ledger-table td.qnum { font-family: "IBM Plex Mono", monospace; color: var(--navy-soft); font-weight: 600; }
  .ledger-load-btn {
    font: inherit; font-family: "IBM Plex Mono", monospace; font-weight: 600;
    background: transparent; border: none; color: var(--navy-soft); cursor: pointer;
    padding: 0; text-decoration: underline; text-underline-offset: 2px;
  }
  .ledger-load-btn:hover { color: var(--navy); }
  .ledger-empty { color: var(--muted); font-size: 12.5px; padding: 10px 2px; }
  .ledger-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; background: var(--paper); box-shadow: var(--shadow); }

  .hint { font-size: 11.5px; color: var(--muted); margin-top: 8px; }

  .rfq-import { margin-top: 14px; border-top: 1px dashed var(--border); padding-top: 12px; }
  .link-btn {
    background: transparent; border: none; color: var(--navy-soft); font: inherit;
    font-size: 12.5px; font-weight: 600; padding: 2px 0; cursor: pointer;
  }
  .link-btn:hover { text-decoration: underline; }
  .link-btn.danger { color: var(--red); }
  .company-result-row { display: flex; align-items: stretch; gap: 2px; }
  .company-result-row .company-result { flex: 1 1 auto; min-width: 0; }
  .company-result-edit {
    flex: 0 0 auto; background: transparent; border: none; color: var(--muted);
    cursor: pointer; font-size: 13px; padding: 0 8px; border-radius: 5px;
  }
  .company-result-edit:hover { background: var(--paper-2); color: var(--ink); }
  .company-edit-panel {
    margin: 4px 0 10px; padding: 12px; border: 1px solid var(--border-soft);
    border-radius: 8px; background: var(--paper-2);
  }
  .company-edit-panel .field-grid { margin-bottom: 8px; }
  .rfq-import-panel { margin-top: 10px; }
  .rfq-import-panel textarea {
    font-family: "IBM Plex Mono", monospace; font-size: 12px; margin-bottom: 8px;
  }
  .rfq-paste-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 4px; }

  .company-lookup { position: relative; margin-bottom: 8px; }
  .company-search-input { margin-bottom: 0; }
  .company-results {
    position: absolute; z-index: 20; top: calc(100% + 4px); left: 0; right: 0;
    max-height: 260px; overflow-y: auto;
    background: var(--paper); border: 1px solid var(--border); border-radius: 8px;
    box-shadow: var(--shadow); padding: 4px;
  }
  .company-result {
    display: flex; flex-direction: column; align-items: flex-start; gap: 1px;
    width: 100%; text-align: left; background: transparent; border: none; cursor: pointer;

function pad5(n) { n = String(Math.trunc(n)); while (n.length < 5) n = "0" + n; return n; }
function money(n) {
  n = Number(n) || 0;
  return n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function todayISO() {
  var d = new Date();
  var m = String(d.getMonth() + 1).padStart(2, "0");
  var day = String(d.getDate()).padStart(2, "0");
  return d.getFullYear() + "-" + m + "-" + day;
}
var MONTH_ABBR = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
// "02 Sep 2026" — day always two digits, month a 3-letter abbreviation, so
// it reads unambiguously regardless of the country reading it (unlike
// M/D/Y vs D/M/Y, which mean different dates depending on where you are).
function formatDisplayDate(year, month, day) {
  return String(day).padStart(2, "0") + " " + MONTH_ABBR[month - 1] + " " + year;
}
function todayDisplay() {
  var d = new Date();
  return formatDisplayDate(d.getFullYear(), d.getMonth() + 1, d.getDate());
}
function nowDisplay() {
  var d = new Date();
  var h = d.getHours(), m = String(d.getMinutes()).padStart(2, "0");
  var ap = h >= 12 ? "PM" : "AM";
  var h12 = h % 12; if (h12 === 0) h12 = 12;
  return h12 + ":" + m + " " + ap;
}
function esc(s) {
  return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

// Condition codes as used in the RFQ Log / trading paperwork: New, Factory
// New, Overhauled, Serviceable, Repaired.
var CD_OPTIONS = ["NE", "FN", "OH", "SV", "REP"];
function normalizeCd(val) {
  var v = String(val || "").trim().toUpperCase();
  return CD_OPTIONS.indexOf(v) !== -1 ? v : "NE";
}
function cdOptionsHtml(selected) {
  var norm = normalizeCd(selected);
  return CD_OPTIONS.map(function (code) {
    return '<option value="' + code + '"' + (code === norm ? " selected" : "") + ">" + code + "</option>";
  }).join("");
}

// Certificate accompanying the part — who issued the paperwork the customer
// will receive with it. Unlike CD, there's no safe default to fall back to:
// certifying a part under a type nobody actually chose would be wrong, so
// this starts blank (an empty leading option) and normalizeCert leaves
// anything unrecognized — including "not chosen yet" — as "" rather than
// coercing it to one of the four real values.
var CERT_OPTIONS = ["MFG C of C", "FAA / EASA", "Supplier C of C", "Stealth Jet C of C"];
function normalizeCert(val) {
  var v = String(val || "").trim();
  return CERT_OPTIONS.indexOf(v) !== -1 ? v : "";
}
function certOptionsHtml(selected) {
  var norm = normalizeCert(selected);
  var blank = '<option value=""' + (norm === "" ? " selected" : "") + "></option>";
  return blank + CERT_OPTIONS.map(function (opt) {
    return '<option value="' + esc(opt) + '"' + (opt === norm ? " selected" : "") + ">" + esc(opt) + "</option>";
  }).join("");
}

// Terms of Payment — a fixed preset list covers most quotes, but no fixed

var TERMS_OPTIONS = [

  "LC (Letter of Credit)", "TT in Advance", "50% Deposit, 50% Before Shipment", "Open Account"
];
function termsOptionsHtml() {
  return TERMS_OPTIONS.map(function (t) {

  }).join("") + '<option value="__OTHER__">Other — type your own…</option>';
}

  if (!sel) return "";
  if (sel.value === "__OTHER__") {
    var custom = document.getElementById("f-terms-custom");
    return custom ? custom.value.trim() : "";
  }
  return sel.value;
}
// Sets Terms of Payment from a saved value — one of the fixed presets
// selects normally; anything else (custom text typed on a past quote)
// selects "Other" and restores that exact text into the free-text field,
// so reopening a quote with custom terms never silently loses them.
function setTermsValue(value) {
  var sel = document.getElementById("f-terms");
  var custom = document.getElementById("f-terms-custom");
  if (!sel) return;
  var v = value || "NETT 30";
  if (TERMS_OPTIONS.indexOf(v) !== -1) {
    sel.value = v;
    if (custom) { custom.hidden = true; custom.value = ""; }
  } else {
    sel.value = "__OTHER__";
    if (custom) { custom.hidden = false; custom.value = v; }
  }
}

// Unit of measure — Each, Feet, Metre. Aerospace hardware trades in all
// three (a hose or wire is quoted by length, most hardware by piece).
var UOM_OPTIONS = ["EA", "FEET", "M"];
function normalizeUom(val) {
  var v = String(val || "").trim().toUpperCase();
  return UOM_OPTIONS.indexOf(v) !== -1 ? v : "EA";
}
function uomOptionsHtml(selected) {
  var norm = normalizeUom(selected);
  return UOM_OPTIONS.map(function (code) {
    return '<option value="' + code + '"' + (code === norm ? " selected" : "") + ">" + code + "</option>";
  }).join("");
}

// Loosely maps whatever unit text a pasted RFQ Log row happens to use onto
// one of our three dropdown options — the Log isn't bound to this tool's
// vocabulary, so "FT", "FOOT", "MTR", "METRE" and the like all show up in
// practice. Returns "" (not "EA") for anything that doesn't clearly match
// one of the three, so the caller can tell "recognized as Each" apart from
// "not recognized at all" and fold the latter into the description instead
// of silently guessing.
function rfqUomToOption(raw) {
  var v = String(raw || "").trim().toUpperCase();
  if (!v) return "";
  if (v === "EA" || v === "EACH" || v === "PC" || v === "PCS") return "EA";
  if (v === "FT" || v === "FEET" || v === "FOOT") return "FEET";
  if (v === "M" || v === "MTR" || v === "MTRS" || v === "METER" || v === "METERS" || v === "METRE" || v === "METRES") return "M";
  return "";
}

// Unit Price cell: either the normal number input, or — when a bulk price
// import found no quote for this particular part — a plain "No quote" pill
// with a small toggle to switch back to a real price. A number input can't
// hold non-numeric text at all (the browser just clears it), so "no quote"
// needs its own explicit state rather than being some magic string typed
// into the price field.
function priceCellHtml(item) {
  var isNoQuote = !!(item && item.price === "NO_QUOTE");
  if (isNoQuote) {
    return (
      '<span class="no-quote-pill">No quote</span>' +
      '<button type="button" class="price-noquote-toggle" data-mode="price" title="Enter a price for this part">✎ Enter price</button>'
    );
  }
  return (
    '<input type="number" class="f-price" value="' + esc(item ? item.price : "") + '" min="0" step="0.01" title="Auto-filled from Cost × Markup — edit directly to override" />' +
    '<button type="button" class="price-noquote-toggle" data-mode="noquote" title="Mark as no quote — no price available yet">🚫 No quote</button>'
  );
}

function itemRowHtml(item, idx) {
  return (
    '<tr data-row="' + idx + '">' +
    '<td class="col-part">' +
      '<input type="text" class="f-part" value="' + esc(item.part) + '" placeholder="Part number" />' +
      // A textarea, not a text input — a single-line input silently clips
      // (never wraps) anything past its width, which would print a note
      // truncated mid-word with no sign anything was cut off. rows="2" plus
      // the app-wide beforeprint auto-grow (any <textarea>, not just the
      // known named ones) keeps a longer note fully readable on paper.
      (item.note
        ? '<textarea class="f-note" rows="2" placeholder="Note for this line (optional)">' + esc(item.note) + "</textarea>" +
          '<div class="ta-mirror f-note-mirror" aria-hidden="true">' + esc(item.note) + "</div>"
        : '<textarea class="f-note" rows="2" placeholder="Note for this line (optional)" hidden></textarea>' +

          '<button type="button" class="row-note-toggle">+ Note</button>') +
    "</td>" +
    '<td class="col-description">' +
      '<input type="text" class="f-description" value="' + esc(item.description || "") + '" placeholder="Description" />' +
      // Same reasoning as the per-line note above: a single-line input
      // clips anything past its width instead of wrapping it, which was
      // quietly cutting real part descriptions off mid-word on the printed
      // quote ("PACKING (PITCHLOC…", "CENTER WING ASSE…"). The always-synced
      // mirror div (see syncDescMirror) swaps in by CSS at print/PDF time,
      // same as #f-to / #f-shipto / #f-notes / .f-note.
      '<div class="ta-mirror desc-mirror" aria-hidden="true">' + esc(item.description || "") + "</div>" +

function recalcRow(tr) {
  var qty = parseFloat(tr.querySelector(".f-qty").value) || 0;
  var priceInput = tr.querySelector(".f-price");
  // "No quote" mode shows a pill instead of a number input — but a row can
  // also carry a real price input that's simply been left empty (a blank
  // manual entry, an RFQ-import row, or an old plain paste that never went
  // through the "No quote" toggle at all). Both cases should read and print
  // as "No quote" rather than a misleading $0.00 that looks like a real
  // quoted price of zero.
  var priceBlank = priceInput ? priceInput.value.trim() === "" : false;
  var isNoQuote = !priceInput || priceBlank;
  var price = priceInput ? (parseFloat(priceInput.value) || 0) : 0;
  var costInput = tr.querySelector(".f-cost");
  var hasCost = costInput && costInput.value.trim() !== "";
  var cost = hasCost ? (parseFloat(costInput.value) || 0) : 0;
  var amt = qty * price;
  var lineAmtEl = tr.querySelector(".line-amt");
  lineAmtEl.textContent = isNoQuote ? "No quote" : money(amt);
  lineAmtEl.classList.toggle("no-quote", isNoQuote);
  var marginEl = tr.querySelector(".line-margin");
  if (marginEl) {
    if (hasCost && !isNoQuote) {
      var margin = amt - cost * qty;
      marginEl.textContent = (margin < 0 ? "-$" : "+$") + money(Math.abs(margin));
      marginEl.classList.toggle("neg", margin < 0);
    } else {
      marginEl.textContent = "";
      marginEl.classList.remove("neg");
    }
  }
  return { amt: isNoQuote ? 0 : amt, cost: hasCost ? cost * qty : 0, hasCost: hasCost };
}

function recalcTotals() {
  var rows = document.querySelectorAll("#item-rows tr");
  var sub = 0;
  var totalCost = 0;
  var anyCost = false;
  rows.forEach(function (tr) {
    var r = recalcRow(tr);
    sub += r.amt;
    if (r.hasCost) { totalCost += r.cost; anyCost = true; }
  });
  var misc = parseFloat(document.getElementById("f-misc").value) || 0;
  var freight = parseFloat(document.getElementById("f-freight").value) || 0;
  document.getElementById("sub-total").textContent = money(sub);
  document.getElementById("grand-total").textContent = money(sub + misc + freight);

  var marginBox = document.getElementById("margin-box");
  if (marginBox) {
    if (anyCost) {
      var margin = sub - totalCost;
      var pct = sub > 0 ? (margin / sub) * 100 : 0;
      document.getElementById("total-cost").textContent = money(totalCost);
      document.getElementById("total-margin").textContent = money(margin);
      document.getElementById("total-margin-pct").textContent = pct.toFixed(1) + "%";
      marginBox.hidden = false;
    } else {
      marginBox.hidden = true;
    }
  }

  return { sub: sub, misc: misc, freight: freight, total: sub + misc + freight };
}

function addRow(item) {
  var tbody = document.getElementById("item-rows");
  var idx = tbody.children.length;
  var wrap = document.createElement("tbody");
  wrap.innerHTML = itemRowHtml(item || blankItem, idx);
  var tr = wrap.firstElementChild;
  tbody.appendChild(tr);
  wireRow(tr);
  return tr;

function applyMarkup(tr) {
  var priceInput = tr.querySelector(".f-price");
  if (!priceInput) return; // row is in "No quote" mode — cost/markup edits shouldn't silently invent a price
  var cost = parseFloat(tr.querySelector(".f-cost").value) || 0;
  var markup = parseFloat(tr.querySelector(".f-markup").value) || 0;
  var computed = cost * (1 + markup / 100);
  priceInput.value = computed ? computed.toFixed(2) : "";
}

// Wires the Unit Price cell's input (recalc on edit) and its "No quote" /
// "Enter price" toggle. Split out from wireRow so the toggle can re-run it
// after swapping the cell's own markup between the two modes.
function wirePriceCell(tr) {
  var cell = tr.querySelector(".price-cell");
  if (!cell) return;
  var priceInput = cell.querySelector(".f-price");
  if (priceInput) priceInput.addEventListener("input", recalcTotals);
  var toggle = cell.querySelector(".price-noquote-toggle");
  if (toggle) {
    toggle.addEventListener("click", function () {
      var mode = toggle.getAttribute("data-mode");
      cell.innerHTML = priceCellHtml({ price: mode === "noquote" ? "NO_QUOTE" : "" });
      wirePriceCell(tr);
      recalcTotals();
      if (mode === "price") {
        var inp = cell.querySelector(".f-price");
        if (inp) inp.focus();
      }
    });
  }
}

function wireRow(tr) {
  tr.querySelectorAll(".f-qty").forEach(function (inp) {
    inp.addEventListener("input", recalcTotals);
  });
  wirePriceCell(tr);
  tr.querySelectorAll(".f-cost, .f-markup").forEach(function (inp) {
    inp.addEventListener("input", function () {
      applyMarkup(tr);
      recalcTotals();
    });
  });
  var noteToggle = tr.querySelector(".row-note-toggle");
  if (noteToggle) {
    noteToggle.addEventListener("click", function () {
      var noteField = tr.querySelector(".f-note");
      noteField.hidden = false;
      noteToggle.hidden = true;
      autoGrowTextarea(noteField);
      noteField.focus();
    });
  }
  tr.querySelector(".row-del").addEventListener("click", function () {
    if (document.querySelectorAll("#item-rows tr").length <= 1) {
      tr.querySelectorAll("input").forEach(function (i) { i.value = ""; });
      var cdField = tr.querySelector(".f-cd");
      if (cdField) cdField.value = "NE";
      var noteField = tr.querySelector(".f-note");
      var toggle = tr.querySelector(".row-note-toggle");
      if (noteField && toggle) {
        // A <textarea> isn't matched by the generic "input" reset loop above,
        // so its value has to be cleared explicitly here.
        noteField.value = "";
        noteField.hidden = true;
        toggle.hidden = false;
      }
      // A "No quote" row has no .f-price input for the generic reset loop
      // above to clear either — swap the cell back to a normal empty price.
      var priceCell = tr.querySelector(".price-cell");
      if (priceCell) {
        priceCell.innerHTML = priceCellHtml({ price: "" });
        wirePriceCell(tr);
      }
      recalcTotals();
      return;
    }
    tr.remove();
    recalcTotals();
  });
}

// Manually insert pasted text at the current cursor position (replacing
// any current selection) into a plain text field. This exists because the
// browser's own default paste behavior — just insert the clipboard text —
// doesn't reliably run in every environment this page is embedded in; the
// paste EVENT still fires and still carries clipboardData either way, so
// building the insertion ourselves from that data works regardless. Same
// reasoning as the custom confirm() modal and the beforeprint textarea
// growth elsewhere in this file: don't depend on a browser default that
// may silently do nothing here.
function pasteTextIntoField(el, text) {
  var start = (el.selectionStart != null) ? el.selectionStart : el.value.length;
  var end = (el.selectionEnd != null) ? el.selectionEnd : el.value.length;
  el.value = el.value.slice(0, start) + text + el.value.slice(end);
  var pos = start + text.length;
  if (el.setSelectionRange) {
    try { el.setSelectionRange(pos, pos); } catch (err) { /* not every input type supports this */ }
  }
  el.dispatchEvent(new Event("input", { bubbles: true }));
}

var PASTE_COLS = ["f-part", "f-cd", "f-qty", "f-price"];

function colIndexForInput(inp) {
  for (var i = 0; i < PASTE_COLS.length; i++) {
    if (inp.classList.contains(PASTE_COLS[i])) return i;
  }
  return -1;
}

function cleanNumber(s) {
  if (s == null) return "";
  var t = String(s).trim().replace(/[$,]/g, "");
  if (t === "") return "";
  var n = parseFloat(t);
  return isNaN(n) ? "" : String(n);
}

// Lets a viewer paste a whole block copied from Excel (Part / CD / Qty /
// Price columns, tab-separated, one row per line) straight into the item
// table instead of typing up to 100 lines by hand. Paste lands on whichever
// cell has focus and flows down/across from there; new rows are created as
// needed. A plain single-column list (e.g. just part numbers) works the
// same way — each line becomes one row in the column that was pasted into.
//
// Every paste into an item row — single value or a whole grid — is handled
// manually here rather than deferring the simple case to the browser's own
// default paste behavior: that default doesn't reliably fire in every
// environment this page runs in, so relying on it made an ordinary
// one-value paste silently do nothing.
// Recognizes a wider set of columns than the plain Part/CD/Qty/Price paste
// below by name — Cert and a "no quote yet" price included — so a block
// copied straight out of a master parts/pricing sheet (in whatever column
// order that sheet happens to use) fills in the whole row, not just the
// four fixed columns. Falls back to the old fixed-order behavior whenever
// no header is recognized, so a plain positional paste still works exactly
// as before.
var GRID_HEADER_ALIASES = {
  "part number": "part", "part #": "part", "part": "part", "p/n": "part", "pn": "part",
  "description": "description", "desc": "description",
  "cd": "cd", "condition": "cd",
  "cert": "cert", "certificate": "cert", "certification": "cert",
  "qty": "qty", "quantity": "qty",
  "uom": "uom", "unit": "uom",
  "cost": "cost",
  "markup": "markup", "markup %": "markup", "markup%": "markup",
  "price": "price", "unit price": "price", "quoted price": "price", "quote": "price", "quote price": "price",
  "lead time": "leadtime", "leadtime": "leadtime", "lead": "leadtime"
};
function detectGridHeader(cells) {
  var map = {};
  var matched = 0;
  cells.forEach(function (c, i) {
    var key = GRID_HEADER_ALIASES[String(c || "").trim().toLowerCase()];
    if (key && map[key] == null) { map[key] = i; matched++; }
  });
  // Require Part plus at least one more recognized column, so a random
  // single-cell paste (e.g. a part number that also happens to read like a
  // header word) is never mistaken for a header row.
  return (matched >= 2 && map.part != null) ? map : null;
}

// Applies a header-mapped bulk paste as brand new rows (like RFQ Log import
// below), rather than overwriting whatever row/column the cursor happened
// to be in — a full-row-per-line import doesn't have a meaningful "landing
// cell" the way the old fixed 4-column paste does.
function applyGridHeaderPaste(dataRows, colMap) {
  var existing = document.querySelectorAll("#item-rows tr");
  if (existing.length === 1 && !existing[0].querySelector(".f-part").value.trim()) {
    existing[0].remove();
  }

  var added = 0;
  var noQuoteCount = 0;
  dataRows.forEach(function (cells) {
    var part = rfqCell(cells, colMap.part);
    if (!part) return;
    var description = rfqCell(cells, colMap.description);
    var cd = colMap.cd != null ? normalizeCd(rfqCell(cells, colMap.cd)) : "NE";
    var certRaw = rfqCell(cells, colMap.cert);
    var cert = normalizeCert(certRaw);
    var note = "";
    // An unrecognized Cert value isn't dropped — same convention as an
    // unrecognized UOM in the RFQ Log import below — it's folded into the
    // line's note instead, so nothing pasted in ever vanishes silently.
    if (certRaw && !cert) note = "Cert (from paste): " + certRaw;
    var qty = colMap.qty != null ? cleanNumber(cells[colMap.qty]) : "";
    var uom = colMap.uom != null ? normalizeUom(rfqCell(cells, colMap.uom)) : "EA";
    var cost = colMap.cost != null ? cleanNumber(cells[colMap.cost]) : "";
    var markup = colMap.markup != null ? cleanNumber(cells[colMap.markup]) : "";
    var price;
    if (colMap.price == null) {
      price = "";
    } else {
      var cleanedPrice = cleanNumber(rfqCell(cells, colMap.price));
      if (cleanedPrice === "") {
        // A Price column was present in the pasted sheet but this
        // particular part had nothing in it — that's an explicit "not
        // quoted yet", not a typo or a row still being filled in, so say
        // so rather than leaving a blank cell that just reads as forgotten.
        price = "NO_QUOTE";
        noQuoteCount++;
      } else {
        price = cleanedPrice;
      }
    }
    var leadTime = colMap.leadtime != null ? rfqCell(cells, colMap.leadtime) : "";
    addRow({ part: part, description: description, cd: cd, cert: cert, qty: qty, uom: uom, cost: cost, markup: markup, price: price, leadTime: leadTime, note: note });
    added++;
  });

  recalcTotals();
  var msg = "Pasted " + added + " line" + (added === 1 ? "" : "s") + " into the table.";
  if (noQuoteCount) msg += " " + noQuoteCount + " part" + (noQuoteCount === 1 ? "" : "s") + " had no price in the pasted data — marked “No quote”.";
  setStatus(msg, added ? "ok" : "err");
}

function handleGridPaste(e) {
  var target = e.target;
  if (!target || !target.tagName || (target.tagName !== "INPUT" && target.tagName !== "SELECT" && target.tagName !== "TEXTAREA")) return;

  var text = (e.clipboardData || window.clipboardData).getData("text");
  if (!text) return;

  var colIdx = colIndexForInput(target);
  if (colIdx === -1) {
    // Not one of the grid-paste columns — e.g. a per-line note field.
    // Plain single-field paste: insert at the cursor like a normal text
    // field would.
    e.preventDefault();
    pasteTextIntoField(target, text);
    return;
  }

  var lines = text.replace(/\r\n/g, "\n").replace(/\r/g, "\n").split("\n");
  while (lines.length && lines[lines.length - 1] === "") lines.pop();
  if (!lines.length) return;

  e.preventDefault();

  var rows = lines.map(function (l) { return l.indexOf("\t") !== -1 ? l.split("\t") : [l]; });
  var headerMap = rows[0].length > 1 ? detectGridHeader(rows[0]) : null;
  if (headerMap) {
    applyGridHeaderPaste(rows.slice(1), headerMap);
    return;
  }

  var tbody = document.getElementById("item-rows");
  var rowsArr = Array.prototype.slice.call(tbody.children);
  var tr = target.closest("tr");
  var startRow = rowsArr.indexOf(tr);
  if (startRow === -1) startRow = rowsArr.length - 1;

  lines.forEach(function (line, r) {
    var rowIndex = startRow + r;
    while (tbody.children.length <= rowIndex) addRow();
    var targetTr = tbody.children[rowIndex];
    var cells = line.indexOf("\t") !== -1 ? line.split("\t") : [line];
    cells.forEach(function (val, c) {
      var col = colIdx + c;
      if (col > 3) return;
      val = val.trim();
      var field = targetTr.querySelector("." + PASTE_COLS[col]);
      if (!field) return;
      field.value = (col === 2 || col === 3) ? cleanNumber(val) : (col === 1 ? normalizeCd(val) : val);
    });
  });

  recalcTotals();
  setStatus("Pasted " + lines.length + " line" + (lines.length === 1 ? "" : "s") + " into the table.", "ok");
}

// ---- RFQ Log import -------------------------------------------------
// Reads rows copied straight out of the shared "RFQ Log - <name> -
// <timestamp>.xlsx" files (Client Name, Date/Time, Email Address, Part
// Number, Description, Qty, UOM, Condition, Urgency, ...). Header-aware
// when a header row is present (robust to whichever columns were
// selected); otherwise falls back to the log's own fixed column order,
// so pasting whole rows works with no header too.
var RFQ_HEADER_ALIASES = {
  "client name": "client",
  "requester name": "contact",
  "email address": "email",
  "part number": "part",
  "description": "description",
  "qty": "qty",
  "quantity": "qty",
  "uom": "uom"
};
var RFQ_FIXED_ORDER = { client: 0, email: 2, part: 3, description: 4, qty: 5, uom: 6 };
var EMAIL_RE = /^\S+@\S+\.\S+$/;

function rfqCell(cells, idx) {
  if (idx == null) return "";
  var v = (cells[idx] || "").trim();
  return v.toLowerCase() === "nan" ? "" : v;
}

function detectRfqHeader(cells) {
  var map = {};
  var matched = 0;
  cells.forEach(function (c, i) {
    var key = RFQ_HEADER_ALIASES[c.trim().toLowerCase()];
    if (key && map[key] == null) { map[key] = i; matched++; }
  });
  return matched >= 2 ? map : null;
}

// Headerless pastes can't rely on a single fixed column order — different
// salespeople's RFQ Logs insert an extra "Requester Name" column in
// different spots, which silently shifts every column after it. Instead of
// trusting a static index, find the Email Address column by its content
// (it's the one thing reliably identifiable by shape alone) and derive
// Part / Description / Qty / UOM as offsets from wherever it actually is.
// Client Name stays anchored at column 0, which is constant across every
// schema variant seen so far.
function detectRfqOrderByContent(rows) {
  var counts = {};
  rows.slice(0, 5).forEach(function (cells) {
    cells.forEach(function (c, i) {
      if (EMAIL_RE.test((c || "").trim())) counts[i] = (counts[i] || 0) + 1;
    });
  });
  var bestIdx = null, bestCount = 0;
  Object.keys(counts).forEach(function (k) {
    if (counts[k] > bestCount) { bestCount = counts[k]; bestIdx = parseInt(k, 10); }
  });
  if (bestIdx == null) return null;
  // Every schema variant seen so far is [Client, (Requester?), Date/Time, Email, Part, ...] —
  // Date/Time always sits directly before Email. So if Email isn't at index 2 (the position
  // it'd be at with no Requester Name column: Client(0), Date(1), Email(2)), the extra slot
  // right after Client Name (index 1) is the Requester Name / contact column.
  var contactIdx = bestIdx > 2 ? 1 : null;
  return {
    client: 0, contact: contactIdx, email: bestIdx,
    part: bestIdx + 1, description: bestIdx + 2, qty: bestIdx + 3, uom: bestIdx + 4
  };
}

// A viewer who isn't working from a full RFQ Log export at all — just a
// short list they typed or trimmed down to Part / Description / Qty (and
// optionally UOM) — has no header row and no Email Address column for
// detectRfqOrderByContent above to anchor on. Rather than guessing at the
// 7-column RFQ Log layout in that case (RFQ_FIXED_ORDER, which needs Part
// at column 4 and would find nothing), treat a narrow paste — nothing
// wider than 4 columns on any row — as already being in the order the
// visible columns read left to right: Part, Description, Qty, UOM. A
// paste that's actually the full RFQ Log layout always has well past 4
// columns, so this never fires for that shape.
function detectRfqBareOrder(rows) {
  var maxCols = 0;
  rows.forEach(function (cells) { if (cells.length > maxCols) maxCols = cells.length; });
  if (maxCols === 0 || maxCols > 4) return null;
  return { part: 0, description: 1, qty: 2, uom: 3 };
}

function importRfqRows(text) {
  var lines = text.replace(/\r\n/g, "\n").replace(/\r/g, "\n").split("\n");
  while (lines.length && lines[lines.length - 1].trim() === "") lines.pop();
  if (!lines.length) return { added: 0, client: null };

  var rows = lines.map(function (l) { return l.split("\t"); });
  var colMap = detectRfqHeader(rows[0]);
  var dataRows = colMap ? rows.slice(1) : rows;
  if (!colMap) colMap = detectRfqOrderByContent(dataRows) || detectRfqBareOrder(dataRows) || RFQ_FIXED_ORDER;

  // Drop the untouched starter row so imported items begin clean.
  var existing = document.querySelectorAll("#item-rows tr");
  if (existing.length === 1 && !existing[0].querySelector(".f-part").value.trim()) {
    existing[0].remove();
  }

  var added = 0;
  var clientName = null;
  var contactName = null;
  var emailAddr = null;
  dataRows.forEach(function (cells) {
    var part = rfqCell(cells, colMap.part);
    if (!part) return;
    var description = rfqCell(cells, colMap.description);
    var qty = colMap.qty != null ? cleanNumber(cells[colMap.qty]) : "";
    var uomRaw = rfqCell(cells, colMap.uom);
    var uom = rfqUomToOption(uomRaw);
    // A RFQ Log UOM this loose match doesn't recognize isn't dropped — it
    // still gets folded into the description, same as before the UOM
    // column existed, so nothing pasted in is ever silently lost.
    if (uomRaw && !uom) {
      description = description ? description + " (" + uomRaw + ")" : "(" + uomRaw + ")";
    }
    addRow({ part: part, description: description, cd: "NE", qty: qty, uom: uom || "EA", price: "" });
    added++;
    if (!clientName) {
      var c = rfqCell(cells, colMap.client);
      if (c) clientName = c;
    }
    if (!contactName) {
      var ct = rfqCell(cells, colMap.contact);
      if (ct) contactName = ct;
    }
    if (!emailAddr) {
      var em = rfqCell(cells, colMap.email);
      if (em) emailAddr = em;
    }
  });

  return { added: added, client: clientName, contact: contactName, email: emailAddr };
}

function collectDraft() {
  var items = [];
  document.querySelectorAll("#item-rows tr").forEach(function (tr) {
    var part = tr.querySelector(".f-part").value.trim();
    var description = tr.querySelector(".f-description") ? tr.querySelector(".f-description").value.trim() : "";
    var qty = tr.querySelector(".f-qty").value;
    var priceInput = tr.querySelector(".f-price");
    var price = priceInput ? priceInput.value : "NO_QUOTE";
    var cost = tr.querySelector(".f-cost") ? tr.querySelector(".f-cost").value : "";
    var markup = tr.querySelector(".f-markup") ? tr.querySelector(".f-markup").value : "";
    var uomField = tr.querySelector(".f-uom");
    var uom = uomField ? uomField.value.trim() : "";
    var leadTimeField = tr.querySelector(".f-leadtime");
    var leadTime = leadTimeField ? leadTimeField.value.trim() : "";
    var noteField = tr.querySelector(".f-note");
    var note = noteField ? noteField.value.trim() : "";
    if (part || description || qty || price) {
      items.push({
        part: part,
        description: description,
        cd: tr.querySelector(".f-cd").value.trim(),
        cert: tr.querySelector(".f-cert") ? tr.querySelector(".f-cert").value.trim() : "",
        qty: qty,
        uom: uom,
        price: price,
        cost: cost,
        markup: markup,
        leadTime: leadTime,
        note: note
      });
    }
  });
  return {
    to: document.getElementById("f-to").value,
    shipTo: document.getElementById("f-shipto").value,
    custRef: document.getElementById("f-custref").value,
    terms: getTermsValue(),
    contact: document.getElementById("f-contact").value,
    email: document.getElementById("f-email").value,
    phone: document.getElementById("f-phone").value,
    preparedBy: document.getElementById("f-prepared").value,
    misc: document.getElementById("f-misc").value,
    freight: document.getElementById("f-freight").value,
    notes: document.getElementById("f-notes").value,
    items: items
  };
}

function filterCompanies(query) {
  query = query.trim().toLowerCase();
  if (!query) return [];
  var out = [];
  for (var i = 0; i < COMPANIES.length && out.length < 8; i++) {
    var c = COMPANIES[i];
    if (
      c.company.toLowerCase().indexOf(query) !== -1 ||
      (c.code && c.code.toLowerCase().indexOf(query) !== -1)
    ) {
      out.push({ c: c, idx: i });
    }
  }
  return out;
}

function companyResultsHtml(matches) {
  if (!matches.length) {
    return '<div class="company-result-empty">No matches — type more of the name, or click “+ Add new company” below to save it for next time.</div>';
  }
  return matches.map(function (m) {
    var c = m.c;
    var loc = [c.city, c.st, c.zip].filter(Boolean).join(", ");
    var sub = [c.code, loc].filter(Boolean).join(" · ");
    return (
      '<div class="company-result-row">' +
        '<button type="button" class="company-result" data-idx="' + m.idx + '">' +
          '<span class="cr-name">' + esc(c.company) + "</span>" +
          (sub ? '<span class="cr-sub">' + esc(sub) + "</span>" : "") +
        "</button>" +
        '<button type="button" class="company-result-edit" data-idx="' + m.idx + '" title="Edit ' + esc(c.company) + '" aria-label="Edit ' + esc(c.company) + '">✎</button>' +
      "</div>"
    );
  }).join("");
}

// Company directory add/edit — kept in memory here; the standalone/
// SharePoint build overrides persistCompaniesChange() below to save the
// whole list to a shared file everyone reads from, so a correction one
// person makes shows up for the whole team without anyone asking for a
// rebuilt file.
var editingCompanyIdx = null;

function openCompanyEditor(idx) {
  editingCompanyIdx = (idx == null) ? null : idx;
  var c = (editingCompanyIdx != null) ? COMPANIES[editingCompanyIdx] : null;
  document.getElementById("company-edit-title").textContent = c ? "Edit company" : "Add new company";
  document.getElementById("ce-company").value = c ? (c.company || "") : "";
  document.getElementById("ce-code").value = c ? (c.code || "") : "";
  document.getElementById("ce-attn").value = c ? (c.attn || "") : "";
  document.getElementById("ce-phone").value = c ? (c.phone || "") : "";
  document.getElementById("ce-email").value = c ? (c.email || "") : "";
  document.getElementById("ce-address").value = c ? (c.address || "") : "";
  document.getElementById("ce-city").value = c ? (c.city || "") : "";
  document.getElementById("ce-st").value = c ? (c.st || "") : "";
  document.getElementById("ce-zip").value = c ? (c.zip || "") : "";
  document.getElementById("ce-country").value = c ? (c.country || "") : "";
  document.getElementById("company-edit-hint").textContent = "";
  document.getElementById("company-edit-delete").hidden = !c;
  document.getElementById("company-results").hidden = true;

function closeCompanyEditor() {

  document.getElementById("company-edit-panel").hidden = true;
}

function readCompanyEditorForm() {

    company: document.getElementById("ce-company").value.trim(),
    code: document.getElementById("ce-code").value.trim(),
    attn: document.getElementById("ce-attn").value.trim(),
    phone: document.getElementById("ce-phone").value.trim(),

    city: document.getElementById("ce-city").value.trim(),
    st: document.getElementById("ce-st").value.trim(),
    zip: document.getElementById("ce-zip").value.trim(),

  };
