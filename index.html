// Toggles the Save button, the "Save as new quote instead" button, and the
// edit-mode hint between "editing an existing quote" and "filling out a
// fresh one". Pass a quote number to enter edit mode, or null/undefined to
// leave it.
function setEditingMode(quoteNumber) {
  editingQuoteNumber = quoteNumber || null;
  var saveBtn = document.getElementById("save-btn");
  var saveAsNewBtn = document.getElementById("save-as-new-btn");
  var editHint = document.getElementById("edit-hint");
  if (editingQuoteNumber) {
    if (saveBtn) saveBtn.textContent = "Save changes to " + editingQuoteNumber;
    if (saveAsNewBtn) saveAsNewBtn.hidden = false;
    if (editHint) {
      editHint.hidden = false;
      var num1 = document.getElementById("edit-hint-num");
      var num2 = document.getElementById("edit-hint-num2");
      if (num1) num1.textContent = editingQuoteNumber;
      if (num2) num2.textContent = editingQuoteNumber;
    }
  } else {
    if (saveBtn) saveBtn.textContent = "Save quote & get next number";
    if (saveAsNewBtn) saveAsNewBtn.hidden = true;
    if (editHint) editHint.hidden = true;
  }
}

// Turns a stored entry.date ("2026-08-27", ISO, date-only) into the same
// "DD Mon YYYY" shape todayDisplay() uses for a fresh quote, so a reopened quote
// reads consistently with one just created. Falls back to today's date for
// anything that doesn't parse (defensive only — every entry.date is written
// by todayISO() at save time).
function isoToDisplay(iso) {
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || "");
  if (!m) return todayDisplay();
  return formatDisplayDate(Number(m[1]), Number(m[2]), Number(m[3]));
}

function loadDraftIntoForm(draft, quoteNumber, quoteDate) {
  document.getElementById("item-rows").innerHTML = "";
  var items = (draft.items && draft.items.length) ? draft.items : [blankItem];
  items.forEach(function (it) { addRow(it); });
  document.getElementById("f-to").value = draft.to || "";
  document.getElementById("f-shipto").value = draft.shipTo || "";
  document.getElementById("f-custref").value = draft.custRef || "";
  setTermsValue(draft.terms);
  document.getElementById("f-contact").value = draft.contact || "";
  document.getElementById("f-email").value = draft.email || "";
  document.getElementById("f-phone").value = draft.phone || "";
  document.getElementById("f-prepared").value = draft.preparedBy || "";
  document.getElementById("prepared-by-echo").textContent = (draft.preparedBy || "").trim() || "—";
  document.getElementById("f-misc").value = draft.misc || 0;
  document.getElementById("f-freight").value = draft.freight || 0;
  // Older saved quotes were saved before notes were editable and won't have
  // this field — fall back to the standard boilerplate rather than showing
  // an empty box.
  document.getElementById("f-notes").value = draft.notes || DEFAULT_NOTES;
  // The big "QUOTATION" header (number + date) is written once into the
  // page's static markup at load time, showing whatever the next unsaved
  // quote would be numbered — reopening an existing quote never used to
  // touch it, so viewing or reprinting Q00001 kept displaying (and
  // printing) Q00002, the placeholder for a quote that hadn't been started
  // yet. Overwrite both here so a reopened quote reads — and prints — as
  // itself, not as whatever was about to be issued next. The date shown
  // is the quote's original issue date, not today's: reprinting the same
  // quote number with a different date would quietly relitigate the
  // Notes boilerplate's "valid for 30 days from the date of issue".
  var qbNumEl = document.getElementById("qb-num");
  if (qbNumEl) qbNumEl.textContent = quoteNumber;
  var docDateEl = document.getElementById("doc-date");
  if (docDateEl) docDateEl.textContent = isoToDisplay(quoteDate);
  recalcTotals();
  autoGrowAllTextareas();
  setEditingMode(quoteNumber);
  setStatus(
    "Reopened " + quoteNumber + " for editing — Save changes updates it in place. Use “Save as new quote instead” if you meant to start a new one from this as a template.",
    "ok"
  );
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function firstLineOf(text) {
  if (!text) return "";
  var lines = text.split("\n").map(function (l) { return l.trim(); }).filter(Boolean);
  for (var i = 0; i < lines.length; i++) {
    var l = lines[i].replace(/^ATTN:\s*/i, "").replace(/^Company:\s*/i, "");
    if (l) return l;
  }
  return "";
}

function guardScriptClose(s) {
  // Only neutralize an actual "</script" sequence (which would prematurely
  // close the enclosing <script> tag when parsed as HTML). A blanket "</"
  // replace is wrong: plenty of legitimate JS ("/</g" inside a regex
  // literal, "</td>" inside an HTML-building string) contains "</" without
  // being a script-closing tag, and corrupting those breaks the script.
  return s.replace(/<\/script/gi, "<\\/script");
}

function buildFullHtml(newState) {
  var json = JSON.stringify(newState).replace(/</g, "\\u003c");
  // scriptSrc becomes the raw-text CONTENT of a freshly-opened <script> tag
  // below, so any accidental "</script" inside main's own source (a comment,
  // a string) must stay guarded here, or it would prematurely close that tag.
  var scriptSrc = guardScriptClose("(" + main.toString() + ")();");
  // HEAD_HTML/TAIL_HTML, by contrast, are emitted as top-level document
  // markup, not nested inside another script element — and HEAD_HTML now
  // contains a real, legitimate script block of its own (the bundled
  // html2canvas library). Guarding it here would rewrite that block's own
  // closing tag into inert text and leave it never actually closed,
  // breaking every reload after the first save. Emit both as-is.
  var doc = HEAD_HTML +
    '<script id="state-data" type="application/json">' + json + "<\/script>\n" +
    "<script>" + scriptSrc + "<\/script>\n" +
    TAIL_HTML;
  return doc;
}

function setStatus(text, kind) {
  var el = document.getElementById("save-status");
  if (!el) return;
  el.textContent = text;
  el.className = "save-status" + (kind ? " " + kind : "");
}

// ---- In-page stand-in for window.confirm() ----
// Native confirm() is blocked the same way window.print() is: this page runs
// in a sandboxed iframe with no "allow-modals" token, so the browser silently
// ignores the call and confirm() always returns false immediately — which is
// why "Clear form" looked like it did nothing no matter what was clicked.
// showConfirm()/hideConfirm() replace it with an ordinary in-page modal built
// from regular DOM elements, which isn't subject to that restriction.
var pendingConfirmCallback = null;
function showConfirm(message, onConfirm, confirmLabel) {
  var overlay = document.getElementById("confirm-overlay");
  if (!overlay) { onConfirm(); return; } // no modal in the DOM — don't block the action
  document.getElementById("confirm-message").textContent = message;
  document.getElementById("confirm-ok-btn").textContent = confirmLabel || "OK";
  pendingConfirmCallback = onConfirm;
  overlay.hidden = false;
  document.getElementById("confirm-cancel-btn").focus();
}
function hideConfirm() {
  var overlay = document.getElementById("confirm-overlay");
  if (overlay) overlay.hidden = true;
  pendingConfirmCallback = null;
}

// ---- PDF download (works around window.print() being blocked inside the
// sandboxed frame this page is served in — it has no "allow-modals" token,
// so the browser silently ignores print()). Renders the quote to an image
// with the bundled html2canvas, wraps that image in a hand-built one-page
// PDF (no library needed for that part — a JPEG can be embedded directly
// via /Filter /DCTDecode), and hands it to the viewer through the
// "downloads" capability, which shows its own save confirmation. ----

function dataUrlToBytes(dataUrl) {
  var base64 = dataUrl.slice(dataUrl.indexOf(",") + 1);
  var bin = atob(base64);
  var bytes = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

// Wraps a single JPEG image as a one-page PDF (A4, centered, margins kept).
// Hand-built rather than pulling in a full PDF library — a one-image PDF is
// a handful of objects and an xref table.
function buildSinglePageImagePdf(jpegBytes, imgWpx, imgHpx) {
  var PAGE_W = 595.28, PAGE_H = 841.89; // A4 in points
  var MARGIN = 24;
  var maxW = PAGE_W - MARGIN * 2;
  var maxH = PAGE_H - MARGIN * 2;
  var aspect = imgWpx / imgHpx;
  var drawW = maxW, drawH = maxW / aspect;
  if (drawH > maxH) { drawH = maxH; drawW = maxH * aspect; }
  var drawX = (PAGE_W - drawW) / 2;
  var drawY = PAGE_H - MARGIN - drawH; // anchor to the top margin, not vertically centered

  var enc = new TextEncoder();
  var chunks = [];
  var offset = 0;
  var objOffsets = [];

  function push(bytesOrStr) {
    var bytes = typeof bytesOrStr === "string" ? enc.encode(bytesOrStr) : bytesOrStr;
    chunks.push(bytes);
    offset += bytes.length;
  }
  function startObj(num) {
    objOffsets[num] = offset;
    push(num + " 0 obj\n");
  }

  push("%PDF-1.4\n");

  startObj(1);
  push("<< /Type /Catalog /Pages 2 0 R >>\nendobj\n");

  startObj(2);
  push("<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n");

  startObj(3);
  push(
    "<< /Type /Page /Parent 2 0 R /Resources << /XObject << /Im0 4 0 R >> >> " +
    "/MediaBox [0 0 " + PAGE_W.toFixed(2) + " " + PAGE_H.toFixed(2) + "] /Contents 5 0 R >>\nendobj\n"
  );

  startObj(4);
  push(
    "<< /Type /XObject /Subtype /Image /Width " + imgWpx + " /Height " + imgHpx +
    " /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length " + jpegBytes.length + " >>\nstream\n"
  );
  push(jpegBytes);
  push("\nendstream\nendobj\n");

  var content = "q\n" + drawW.toFixed(2) + " 0 0 " + drawH.toFixed(2) + " " +
    drawX.toFixed(2) + " " + drawY.toFixed(2) + " cm\n/Im0 Do\nQ";
  var contentBytes = enc.encode(content);
  startObj(5);
  push("<< /Length " + contentBytes.length + " >>\nstream\n");
  push(contentBytes);
  push("\nendstream\nendobj\n");

  var xrefOffset = offset;
  var xref = "xref\n0 6\n0000000000 65535 f \n";
  for (var i = 1; i <= 5; i++) {
    xref += String(objOffsets[i]).padStart(10, "0") + " 00000 n \n";
  }
  push(xref);
  push("trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n" + xrefOffset + "\n%%EOF");

  var total = 0;
  chunks.forEach(function (c) { total += c.length; });
  var out = new Uint8Array(total);
  var pos = 0;
  chunks.forEach(function (c) { out.set(c, pos); pos += c.length; });
  return new Blob([out], { type: "application/pdf" });
}

// html2canvas has a known limitation with <textarea> elements: it doesn't
// reliably reproduce their multi-line wrapping, so a filled-in address block
// can come out squashed onto one line and cut off — and separately, the
// "+ Note" toggle and an empty per-line note shouldn't appear in the PDF at
// all. Both used to be handled by mutating the DOM right before capture
// (swap each textarea for a plain div, hide empty note fields); now that
// every one of those fields carries an always-synced mirror (syncTaMirror)
// and .pdf-render-mode's own CSS already hides/collapses everything that
// needs it — same as @media print does for the browser's native print,
// see the comment there — .pdf-render-mode is all renderQuotePdfBlob needs
// to set, with nothing left to mutate and restore around the capture.
async function renderQuotePdfBlob() {
  if (typeof html2canvas !== "function") throw { code: "unavailable" };
  var target = document.querySelector(".paper");
  if (!target) throw { code: "unavailable" };
  document.body.classList.add("pdf-render-mode");
  var canvas;
  try {
    canvas = await html2canvas(target, { scale: 3, backgroundColor: "#ffffff", useCORS: false, logging: false });
  } finally {
    document.body.classList.remove("pdf-render-mode");
  }
  var jpegBytes = dataUrlToBytes(canvas.toDataURL("image/jpeg", 0.97));
  return buildSinglePageImagePdf(jpegBytes, canvas.width, canvas.height);
}

// Textareas (To / Ship To / Notes / per-line notes) don't grow to fit their
// content by default — past the box's rows-based height, the browser just
// shows an internal scrollbar, and whatever's scrolled out of view reads as
// silently missing (a real problem for something meant to be read on a
// printed page). beforeprint already re-grows every textarea right before
// the browser's print engine runs (see below), but that alone still leaves
// a scrollable, seemingly-cut-off box on screen any time typed or
// pasted-in content — the default Notes boilerplate included, once its
// longest line wraps — exceeds the box's starting height. Growing on screen
// too, continuously as content changes, means what's visible while editing
// is always exactly what will print — no separate on-screen-vs-print state
// to get out of sync.
function autoGrowTextarea(ta) {
  if (!ta) return;
  // Every element here is box-sizing: border-box (see the universal "*"
  // rule), so an explicit height is the box's TOTAL height, border
  // included — but scrollHeight only ever reports the content+padding
  // height, with the border never counted either way. Setting
  // style.height straight from scrollHeight is short by exactly the
  // border width, which quietly leaves the box a couple of pixels too
  // short for its own content on every single grow.
  var cs = getComputedStyle(ta);
  var borderY = (parseFloat(cs.borderTopWidth) || 0) + (parseFloat(cs.borderBottomWidth) || 0);
  ta.style.height = "auto";
  ta.style.height = (ta.scrollHeight + borderY) + "px";
  syncTaMirror(ta);
}
function autoGrowAllTextareas(scope) {
  (scope || document).querySelectorAll("textarea").forEach(autoGrowTextarea);
}

// Keep a plain-text mirror <div> next to a textarea (see the "ta-mirror"
// CSS) in sync with whatever's currently typed, so print never has to
// mutate the DOM at print time to get real, breakable text on paper — see
// the @media print comment by "#f-to, #f-shipto, #f-notes, .f-note" for
// why that reactive swap turned out to be unsafe. Every place that sets a
// textarea's value already calls autoGrowTextarea right after (which now
// calls this too), so this one helper keeps every mirror current.
function syncTaMirror(ta) {
  if (!ta) return;
  var mirror = ta.nextElementSibling;
  if (!mirror || !mirror.classList || !mirror.classList.contains("ta-mirror")) return;
  mirror.textContent = ta.value;
}

function init() {
  editingQuoteNumber = null;
  root.innerHTML = shellHtml();

  var items = (STATE.draftItems && STATE.draftItems.length) ? STATE.draftItems : [blankItem];
  items.forEach(function (it) { addRow(it); });
  document.getElementById("f-notes").value = DEFAULT_NOTES;
  recalcTotals();
  autoGrowAllTextareas();

  document.getElementById("add-line").addEventListener("click", function () { addRow(); recalcTotals(); });
  document.getElementById("item-rows").addEventListener("paste", handleGridPaste);
  document.getElementById("rfq-import-toggle").addEventListener("click", function () {
    var panel = document.getElementById("rfq-import-panel");
    panel.hidden = !panel.hidden;
    if (!panel.hidden) document.getElementById("rfq-import-box").focus();
  });
  var rfqPasteBtn = document.getElementById("rfq-paste-btn");
  if (rfqPasteBtn) {
    rfqPasteBtn.addEventListener("click", function () {
      var box = document.getElementById("rfq-import-box");
      if (!navigator.clipboard || !navigator.clipboard.readText) {
        setStatus("This browser won’t let the page read the clipboard directly — click into the box and try Ctrl+V (⌘V on Mac), or right-click → Paste.", "err");
        return;
      }
      // navigator.clipboard.readText() is a different mechanism from the
      // 'paste' event entirely — it needs no keyboard shortcut to reach
      // the page, only a direct click (the user gesture it requires), so
      // it's a genuine fallback rather than another path through the same
      // thing that wasn't working.
      navigator.clipboard.readText().then(function (text) {
        if (!text) {
          setStatus("Your clipboard looks empty — copy the RFQ Log rows first, then try again.", "err");
          return;
        }
        pasteTextIntoField(box, text);
        box.focus();
        setStatus("Pasted from clipboard.", "ok");
      }).catch(function () {
        setStatus("This browser blocked clipboard access here — click into the box and try Ctrl+V (⌘V on Mac), or right-click → Paste.", "err");
      });
    });
  }
  document.getElementById("rfq-import-btn").addEventListener("click", function () {
    var box = document.getElementById("rfq-import-box");
    var text = box.value;
    if (!text.trim()) { setStatus("Paste some RFQ Log rows first.", "err"); return; }
    var result = importRfqRows(text);
    if (!result.added) {
      setStatus("Couldn’t find a Part Number in what was pasted — check the columns and try again.", "err");
      return;
    }
    recalcTotals();
    var toField = document.getElementById("f-to");
    if (result.client && !toField.value.trim()) {
      toField.value = "ATTN: \nCompany: " + result.client + "\nAddress: \nCountry: ";
    }
    var contactField = document.getElementById("f-contact");
    if (result.contact && contactField && !contactField.value.trim()) {
      contactField.value = result.contact;
    }
    var emailField = document.getElementById("f-email");
    if (result.email && emailField && !emailField.value.trim()) {
      emailField.value = result.email;
    }
    box.value = "";
    autoGrowTextarea(toField);
    setStatus(
      "Imported " + result.added + " line" + (result.added === 1 ? "" : "s") +
      (result.client ? " for " + result.client : "") + ".",
      "ok"
    );
  });
  document.getElementById("f-misc").addEventListener("input", recalcTotals);
  document.getElementById("f-freight").addEventListener("input", recalcTotals);
  // The browser's own print pagination only comes out clean when this page
  // is the top-level document. Inside Claude's embedded chat/artifact view
  // this page runs nested in a sandboxed frame, and calling window.print()
  // there ends up paginating the surrounding frame rather than just this
  // quote — producing extra blank pages instead of a usable PDF. Cross-
  // origin access to window.top throws, which itself only happens when
  // nested, so that failure counts as "embedded" too.
  function isTopLevelWindow() {
    try {
      return window === window.top;
    } catch (e) {
      return false;
    }
  }
  document.getElementById("print-btn").addEventListener("click", async function () {
    var btn = this;
    if (!window.claude || !window.claude.use) {
      // Not running inside the Claude viewer at all (e.g. opened as a plain
      // local file) — the ordinary browser print dialog works fine here.
      window.print();
      document.getElementById("print-hint").hidden = false;
      return;
    }
    var originalLabel = btn.textContent;
    btn.disabled = true;
    btn.textContent = "Preparing PDF…";
    try {
      var downloads = await window.claude.use("downloads");
      if (!downloads) throw { code: "unavailable" };
      var pdfBlob = await renderQuotePdfBlob();
      var qnumEl = document.querySelector(".qb-num");
      var qnum = (qnumEl ? qnumEl.textContent.trim() : "") || "Quote";
      await downloads.save({ filename: qnum + ".pdf", data: pdfBlob });
      setStatus("Saved " + qnum + ".pdf.", "ok");
    } catch (err) {
      var code = err && err.code;
      if (code === "declined") {
        setStatus("PDF download cancelled.", "err");
      } else if (code === "rate_limited") {
        setStatus("A download prompt is already open — try again in a moment.", "err");
      } else if (code === "too_large") {
        setStatus("This quote is too large to save as a PDF here — try Ctrl+P / ⌘P to print instead.", "err");
      } else if (!isTopLevelWindow()) {
        // See isTopLevelWindow() above — window.print() would only make a
        // broken, blank-page-padded PDF here. Note this is true even in the
        // "open in browser" / shared-link view, not just the in-chat one —
        // claude.ai serves both inside the same sandboxed frame, so there is
        // no link a viewer can open that escapes it. Point people at retrying
        // the PDF download rather than at a "use your own tab" workaround
        // that doesn't actually exist.
        setStatus(
          "Couldn’t prepare a PDF download just now. Printing directly from here (Ctrl+P / ⌘P) can come out with extra blank pages — try clicking Print / Save as PDF again in a moment.",
          "err"
        );
      } else {
        // unavailable / not_granted / extension_not_enabled / rejected_extension /
        // capability_disabled / capability_removed, or a rendering failure —
        // and we're a real top-level page, so the browser's own print dialog
        // will paginate this correctly.
        window.print();
        document.getElementById("print-hint").hidden = false;
      }
    } finally {
      btn.disabled = false;
      btn.textContent = originalLabel;
    }
  });
  document.getElementById("clear-btn").addEventListener("click", function () {
    showConfirm("Clear all fields on this quote? This does not affect saved quotes.", function () {
      init();
    }, "Clear form");
  });
  document.getElementById("confirm-cancel-btn").addEventListener("click", hideConfirm);
  document.getElementById("confirm-ok-btn").addEventListener("click", function () {
    var cb = pendingConfirmCallback;
    hideConfirm();
    if (cb) cb();
  });
  document.getElementById("confirm-overlay").addEventListener("click", function (e) {
    if (e.target === this) hideConfirm(); // click on the backdrop = cancel
  });
  var preparedInput = document.getElementById("f-prepared");
  preparedInput.addEventListener("change", function () {
    document.getElementById("prepared-by-echo").textContent = preparedInput.value.trim() || "—";
  });

  var termsSelect = document.getElementById("f-terms");
  var termsCustom = document.getElementById("f-terms-custom");
  if (termsSelect && termsCustom) {
    termsSelect.addEventListener("change", function () {
      termsCustom.hidden = termsSelect.value !== "__OTHER__";
      if (!termsCustom.hidden) termsCustom.focus();
    });
  }

  document.getElementById("save-btn").addEventListener("click", function () {
    onSave(false);
  });
  var saveAsNewBtn = document.getElementById("save-as-new-btn");
  if (saveAsNewBtn) {
    saveAsNewBtn.addEventListener("click", function () {
      onSave(true);
    });
  }

  var companySearch = document.getElementById("company-search");
  var companyResults = document.getElementById("company-results");
  if (companySearch && companyResults) {
    companySearch.addEventListener("input", function () {
      closeCompanyEditor();
      var q = companySearch.value;
      if (!q.trim()) {
        companyResults.hidden = true;
        companyResults.innerHTML = "";
        return;
      }
      companyResults.innerHTML = companyResultsHtml(filterCompanies(q));
      companyResults.hidden = false;
    });
    companySearch.addEventListener("focus", function () {
      if (companySearch.value.trim()) {
        closeCompanyEditor();
        companyResults.hidden = false;
      }
    });
    companyResults.addEventListener("click", function (e) {
      var editBtn = e.target.closest(".company-result-edit");
      if (editBtn) {
        openCompanyEditor(parseInt(editBtn.getAttribute("data-idx"), 10));
        return;
      }
      var btn = e.target.closest(".company-result");
      if (!btn) return;
      var idx = parseInt(btn.getAttribute("data-idx"), 10);
      var c = COMPANIES[idx];
      if (!c) return;
      applyCompanyToForm(c);
      companySearch.value = "";
      companyResults.hidden = true;
      companyResults.innerHTML = "";
    });
    document.addEventListener("click", function (e) {
      if (!companyResults.hidden && e.target !== companySearch && !companyResults.contains(e.target)) {
        companyResults.hidden = true;
      }
    });
  }

  var companyAddBtn = document.getElementById("company-add-btn");
  if (companyAddBtn) {
    companyAddBtn.addEventListener("click", function () { openCompanyEditor(null); });
  }
  var companyEditCancel = document.getElementById("company-edit-cancel");
  if (companyEditCancel) companyEditCancel.addEventListener("click", closeCompanyEditor);
  var companyEditSave = document.getElementById("company-edit-save");
  if (companyEditSave) {
    companyEditSave.addEventListener("click", function () {
      var data = readCompanyEditorForm();
      if (!data.company) {
        document.getElementById("company-edit-hint").textContent = "Company name is required.";
        return;
      }
      if (editingCompanyIdx == null) {
        COMPANIES.push(data);
      } else {
        COMPANIES[editingCompanyIdx] = data;
      }
      closeCompanyEditor();
      persistCompaniesChange();
    });
  }
  var companyEditDelete = document.getElementById("company-edit-delete");
  if (companyEditDelete) {
    companyEditDelete.addEventListener("click", function () {
      if (editingCompanyIdx == null) return;
      var c = COMPANIES[editingCompanyIdx];
      showConfirm("Remove " + (c ? c.company : "this company") + " from the company list? This doesn’t affect any quote already saved.", function () {
        COMPANIES.splice(editingCompanyIdx, 1);
        closeCompanyEditor();
        persistCompaniesChange();
      }, "Delete company");
    });
  }

  var ledgerBody = document.getElementById("ledger-body");
  if (ledgerBody) {
    ledgerBody.addEventListener("click", function (e) {
      var btn = e.target.closest(".ledger-load-btn");
      if (!btn) return;
      var idx = parseInt(btn.getAttribute("data-idx"), 10);
      var entry = STATE.log && STATE.log[idx];
      if (!entry || !entry.draft) return;
      loadDraftIntoForm(entry.draft, entry.number, entry.date);
    });
  }
}

// forceNew: true from "Save as new quote instead" — always issues the next
// number, even if a quote is currently loaded for editing. false/omitted
// from the main Save button — overwrites the loaded quote in place when one
// is being edited, otherwise behaves the same as forceNew.
function onSave(forceNew) {
  var btn = document.getElementById("save-btn");
  var saveAsNewBtn = document.getElementById("save-as-new-btn");
  var draft = collectDraft();
  if (!draft.items.length) {
    setStatus("Add at least one line item before saving.", "err");
    return;
  }
  var totals = recalcTotals();
  var customerName = firstLineOf(draft.to) || "—";

  // Re-find the entry by number rather than trusting a remembered index —
  // the log can only have grown since this quote was loaded, but looking it
  // up fresh here is what makes that safe rather than assumed.
  var editIdx = -1;
  if (!forceNew && editingQuoteNumber) {
    editIdx = (STATE.log || []).findIndex(function (e) { return e.number === editingQuoteNumber; });
  }
  var isUpdate = editIdx !== -1;

  var entry = {
    number: isUpdate ? editingQuoteNumber : "Q" + pad5(STATE.nextNumber),
    date: todayISO(),
    customer: customerName,
    total: Math.round(totals.total * 100) / 100,
    preparedBy: draft.preparedBy || "",
    draft: draft
  };

  var newLog, newNextNumber;
  if (isUpdate) {
    newLog = (STATE.log || []).slice();
    newLog[editIdx] = entry;
    newNextNumber = STATE.nextNumber; // updating in place never consumes a number
  } else {
    newLog = (STATE.log || []).concat([entry]);
    if (newLog.length > 200) newLog = newLog.slice(newLog.length - 200);
    newNextNumber = STATE.nextNumber + 1;
  }
  var newState = { nextNumber: newNextNumber, log: newLog };

  btn.disabled = true;
  if (saveAsNewBtn) saveAsNewBtn.disabled = true;
  setStatus("Saving…");

  if (!graphSignedInAccount()) {
    setStatus("Sign in with Microsoft first (top right) so this quote saves to the shared ledger.", "err");
    btn.disabled = false;
    if (saveAsNewBtn) saveAsNewBtn.disabled = false;
    return;
  }
  saveLedgerToGraph(newState).then(function () {
    setStatus((isUpdate ? "Updated " : "Saved ") + entry.number + ". Reloading…", "ok");
    setTimeout(function () { window.location.reload(); }, 400);
  }).catch(function (e) {
    var code = (e && e.code) || "unknown";
    if (code === "conflict") {
      setStatus("Someone else just saved a quote — reload to see the latest numbers, then try again.", "err");
    } else if (code === "signed_out") {
      setStatus("Your Microsoft sign-in expired — click “Sign in with Microsoft” and try saving again.", "err");
    } else {
      setStatus("Couldn’t save (" + code + "). Your entries are still here — try again.", "err");
    }
    btn.disabled = false;
    if (saveAsNewBtn) saveAsNewBtn.disabled = false;
  });
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", init);
} else {
  init();
}

// ===== Microsoft sign-in + SharePoint-backed shared ledger =====
// Replaces claude.ai's artifact.publish()/use("artifact") save mechanism.
// The page is fully usable immediately from the embedded seed state below
// (view, edit, print) even signed out or offline — signing in only adds
// "save to the shared ledger" and "pull in what colleagues have saved".
var MSAL_CONFIG = {
  auth: {
    clientId: "%%MSAL_CLIENT_ID%%",
    authority: "https://login.microsoftonline.com/%%MSAL_TENANT_ID%%",
    redirectUri: window.location.origin + window.location.pathname
  },
  cache: { cacheLocation: "localStorage", storeAuthStateInCookie: false }
};
var GRAPH_SCOPES = ["Files.ReadWrite", "User.Read"];
var GRAPH_LEDGER_URL = "https://graph.microsoft.com/v1.0/sites/stealthjet.sharepoint.com:/sites/StealthJetSingapore:/drive/root:/Quote Runner App/ledger.json";
var GRAPH_COMPANIES_URL = "https://graph.microsoft.com/v1.0/sites/stealthjet.sharepoint.com:/sites/StealthJetSingapore:/drive/root:/Quote Runner App/companies.json";
var msalInstance = (typeof msal !== "undefined" && MSAL_CONFIG.auth.clientId.indexOf("%%") !== 0)
  ? new msal.PublicClientApplication(MSAL_CONFIG)
  : null;
var _ledgerEtag = null;
var _companiesEtag = null;

function graphSignedInAccount() {
  if (!msalInstance) return null;
  var accts = msalInstance.getAllAccounts();
  return accts.length ? accts[0] : null;
}

function graphGetToken(interactive) {
  if (!msalInstance) return Promise.reject({ code: "unavailable" });
  var account = graphSignedInAccount();
  var silent = account
    ? msalInstance.acquireTokenSilent({ scopes: GRAPH_SCOPES, account: account })
    : Promise.reject({ code: "signed_out" });
  return silent.catch(function () {
    if (!interactive) return Promise.reject({ code: "signed_out" });
    return msalInstance.loginPopup({ scopes: GRAPH_SCOPES });
  }).then(function (res) {
    return res.accessToken;
  });
}

function updateSignInUi() {
  var el = document.getElementById("signin-status");
  var btn = document.getElementById("signin-btn");
  if (!el || !btn) return;
  var account = graphSignedInAccount();
  if (account) {
    el.textContent = "Signed in as " + (account.username || account.name || "");
    btn.textContent = "Switch account";
  } else {
    el.textContent = "Not signed in — quotes here are view/print only";
    btn.textContent = "Sign in with Microsoft";
  }
}

function refreshLedgerFromGraph() {
  return graphGetToken(false).then(function (token) {
    return fetch(GRAPH_LEDGER_URL + ":/content", { headers: { Authorization: "Bearer " + token } });
  }).then(function (resp) {
    if (resp.status === 404) { _ledgerEtag = null; return null; } // no quotes saved to Graph yet
    if (!resp.ok) throw { code: "graph_error", status: resp.status };
    _ledgerEtag = resp.headers.get("ETag");
    return resp.json();
  }).then(function (remote) {
    if (!remote) return;
    STATE.nextNumber = remote.nextNumber;
    STATE.log = remote.log;
    var ledgerBody = document.getElementById("ledger-body");
    if (ledgerBody) ledgerBody.innerHTML = ledgerHtml(STATE.log);
    var qbNum = document.getElementById("qb-num");
    // Only the *next fresh quote's* placeholder number ever needs updating
    // here — a quote already loaded for editing keeps its own number.
    if (qbNum && !editingQuoteNumber) qbNum.textContent = "Q" + pad5(STATE.nextNumber);
  });
}

function saveLedgerToGraph(newState) {
  return graphGetToken(true).then(function (token) {
    var headers = { Authorization: "Bearer " + token, "Content-Type": "application/json" };
    if (_ledgerEtag) headers["If-Match"] = _ledgerEtag;
    return fetch(GRAPH_LEDGER_URL + ":/content", {
      method: "PUT",
      headers: headers,
      body: JSON.stringify(newState)
    });
  }).then(function (resp) {
    if (resp.status === 412) throw { code: "conflict" };
    if (!resp.ok) throw { code: "graph_error", status: resp.status };
    return resp.json();
  });
}

// Company directory — same shared-file-with-ETag pattern as the ledger
// above, in its own file so an edit to a company's address is a small,
// independent save that can never collide with (or get lost inside) a
// concurrent quote save. Nobody has necessarily edited a company yet on a
// fresh deployment, so a 404 here just means "keep using the built-in seed
// list this page already loaded" rather than an error — the file gets
// created automatically the first time anyone actually saves an edit.
function refreshCompaniesFromGraph() {
  return graphGetToken(false).then(function (token) {
    return fetch(GRAPH_COMPANIES_URL + ":/content", { headers: { Authorization: "Bearer " + token } });
  }).then(function (resp) {
    if (resp.status === 404) { _companiesEtag = null; return null; } // no edits saved to Graph yet — keep the built-in seed list
    if (!resp.ok) throw { code: "graph_error", status: resp.status };
    _companiesEtag = resp.headers.get("ETag");
    return resp.json();
  }).then(function (remote) {
    // Defensive: only replace the built-in seed list with something that
    // actually looks like a company directory. A malformed or unexpected
    // response (wrong file at that path, a bad manual edit on SharePoint)
    // should never wipe out the working in-memory list — just keep using
    // what's already loaded.
    if (!remote || !Array.isArray(remote)) return;
    COMPANIES.length = 0;
    remote.forEach(function (c) { COMPANIES.push(c); });
  });
}

function saveCompaniesToGraph(newCompanies) {
  return graphGetToken(true).then(function (token) {
    var headers = { Authorization: "Bearer " + token, "Content-Type": "application/json" };
    if (_companiesEtag) headers["If-Match"] = _companiesEtag;
    return fetch(GRAPH_COMPANIES_URL + ":/content", {
      method: "PUT",
      headers: headers,
      body: JSON.stringify(newCompanies)
    });
  }).then(function (resp) {
    if (resp.status === 412) throw { code: "conflict" };
    if (!resp.ok) throw { code: "graph_error", status: resp.status };
    return resp.json();
  }).then(function (saved) {
    // A successful PUT's own response doesn't reliably hand back a fresh
    // ETag the same way the ledger's does in every case — re-fetch it so
    // the very next edit's If-Match is guaranteed current rather than
    // risking a spurious 412 against ourselves.
    return refreshCompaniesFromGraph().then(function () { return saved; });
  });
}

document.addEventListener("DOMContentLoaded", function () {
  var signinBtn = document.getElementById("signin-btn");
  if (!signinBtn) return;
  if (!msalInstance) {
    signinBtn.disabled = true;
    document.getElementById("signin-status").textContent = "Sign-in isn’t configured on this deployment yet.";
    return;
  }
  signinBtn.addEventListener("click", function () {
    signinBtn.disabled = true;
    setStatus("Signing in…");
    graphGetToken(true).then(function () {
      return Promise.all([refreshLedgerFromGraph(), refreshCompaniesFromGraph()]);
    }).then(function () {
      updateSignInUi();
      setStatus("Signed in — ledger refreshed.", "ok");
    }).catch(function () {
      setStatus("Sign-in didn’t complete — try again.", "err");
    }).finally(function () { signinBtn.disabled = false; });
  });
  msalInstance.handleRedirectPromise().catch(function () {}).then(function () {
    updateSignInUi();
    if (graphSignedInAccount()) {
      Promise.all([refreshLedgerFromGraph(), refreshCompaniesFromGraph()]).then(updateSignInUi).catch(function () {});
    }
  });
});


// Grow any textarea as the person types or pastes into it, so a box never
// silently scrolls content out of view on screen — bound once, here, via
// delegation on document (rather than per-row/per-render) so it keeps
// working across every init() re-render and every dynamically-added item
// row without needing to be rewired each time.
document.addEventListener("input", function (e) {
  if (e.target && e.target.tagName === "TEXTAREA") autoGrowTextarea(e.target);
  // .f-description and .f-leadtime carry the same always-synced mirror div
  // as the textareas above (see syncTaMirror and the "desc-mirror" /
  // "leadtime-mirror" CSS) — they just need the sync, not the auto-grow,
  // since a single-line input doesn't resize. pasteTextIntoField's manual
  // paste path already dispatches a real "input" event after setting
  // .value, so it's covered here too.
  if (e.target && e.target.classList && (e.target.classList.contains("f-description") || e.target.classList.contains("f-leadtime"))) {
    syncTaMirror(e.target);
  }
});

// Cert is a <select>, which never fires "input" — only "change" — so it
// needs its own delegated listener to keep .cert-mirror current, same
// reasoning and same syncTaMirror helper as f-description/f-leadtime above.
document.addEventListener("change", function (e) {
  if (e.target && e.target.classList && e.target.classList.contains("f-cert")) {
    syncTaMirror(e.target);
  }
});

// Fallback for every plain text field OUTSIDE the item table (To, Ship To,
// Notes, the RFQ import box, Cust Ref, Contact, Email, Phone, the company
// search box): insert pasted text ourselves rather than counting on the
// browser's own default paste behavior, which doesn't reliably run in
// every environment this page is embedded in — the paste event and its
// clipboardData still arrive either way. Fields inside #item-rows are
// excluded here since handleGridPaste already owns paste handling for the
// whole item table (single values, per-line notes, and multi-cell grid
// pastes alike).
document.addEventListener("paste", function (e) {
  var target = e.target;
  if (!target || !target.tagName) return;
  if (target.tagName !== "INPUT" && target.tagName !== "TEXTAREA") return;
  if (target.closest("#item-rows")) return;
  var text = (e.clipboardData || window.clipboardData).getData("text");
  if (!text) return;
  e.preventDefault();
  pasteTextIntoField(target, text);
});

// There is deliberately NO beforeprint/afterprint handler here anymore.
// There used to be one — it swapped textareas for plain divs and hid empty
// per-line notes right as printing began, to keep a <textarea> (an atomic,
// unsplittable box to a print engine) from stranding the layout hunting
// for a whole blank page tall enough to hold it. That handler is exactly
// what caused the *other* print bug diagnosed elsewhere in this file (see
// the @media print comment by "#f-to, #f-shipto, #f-notes, .f-note, .f-description"):
// mutating the DOM from inside the real beforeprint event, immediately
// before Chrome's print engine captures the page, can silently corrupt an
// unrelated cell's text elsewhere on the page — confirmed more than once,
// most recently as the Qty/UOM columns going blank on a row with neither
// a duplicate amount nor anything printed by the old handler, just from it
// running at all. Every field that handler used to touch reactively — #f-to,
// #f-shipto, #f-notes, .f-note, the "+ Note" toggle, .f-description, and
// .f-leadtime — is now handled the same declarative way: an always-synced
// mirror kept current on every keystroke (syncTaMirror) and swapped in by
// plain CSS at print time, so nothing needs to mutate the DOM when
// printing starts at all. Do not add one back for a new field; give it a
// mirror instead.

// Escape cancels the in-page confirm modal, same as it would a native
// confirm() dialog. Bound once here rather than per-render since it only
// needs to check whatever overlay currently exists in the DOM.
document.addEventListener("keydown", function (e) {
  if (e.key !== "Escape") return;
  var overlay = document.getElementById("confirm-overlay");
  if (overlay && !overlay.hidden) hideConfirm();
});

window.__quoteRunnerBuildFullHtml = buildFullHtml;
})();</script>
</body>
</html>
